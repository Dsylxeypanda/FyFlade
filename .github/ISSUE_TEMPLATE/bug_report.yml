name: Bug report
description: Report a reproducible FyFlade problem without including private account or chat data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not submit passwords, tokens, private chat logs, or security vulnerabilities here. Follow SECURITY.md for security reports.
  - type: input
    id: version
    attributes:
      label: FyFlade version
      placeholder: "1.0"
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Distribution
      options:
        - Installed
        - Portable
        - Development build
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows and platform details
      description: Include Windows version and whether this concerns Twitch, Kick, YouTube, OBS, or another integration.
