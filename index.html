<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>FyFlade</title>

    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      html {
        background: #0e0f12;
      }

      /*
        Fyflate scrollbar
        Tynn og diskret, inspirert av Chatterino.
      */

      * {
        scrollbar-width: thin;
        scrollbar-color:
          rgba(125, 130, 140, 0.5)
          transparent;
      }

      *::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }

      *::-webkit-scrollbar-track {
        background: transparent;
      }

      *::-webkit-scrollbar-thumb {
        background:
          rgba(125, 130, 140, 0.5);

        border-radius: 999px;
      }

      *::-webkit-scrollbar-thumb:hover {
        background:
          rgba(165, 170, 180, 0.78);
      }

      *::-webkit-scrollbar-thumb:active {
        background:
          rgba(195, 200, 210, 0.92);
      }

      *::-webkit-scrollbar-button {
        display: none;

        width: 0;
        height: 0;
      }

      *::-webkit-scrollbar-corner {
        background: transparent;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
